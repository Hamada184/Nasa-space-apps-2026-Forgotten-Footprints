<main id="main" class="platform-main" data-dossier>
  <section class="page-intro dossier-atmosphere">
    <p class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="dossierKicker"></span></p>
    <h1 data-i18n="dossierTitle"></h1>
    <p class="lede" data-i18n="dossierIntro"></p>
    <p class="intro-meta" data-i18n="homePreviewLabel"></p>
  </section>
  <section class="museum-room museum-room-artifact" data-museum-scene="artifact">
    <div class="museum-room-heading">
      <p class="eyebrow" data-i18n="artifactChamber"></p>
      <h2 data-artifact-name></h2>
      <p data-i18n="artifactModelNote"></p>
    </div>
    <div class="scene-frame">
      <canvas tabindex="0" role="img" aria-label="Conceptual interactive exhibit model" data-i18n-aria="sceneCanvasLabel"></canvas>
      <p class="scene-fallback" data-scene-fallback hidden data-i18n="sceneFallback"></p>
    </div>
    <div class="artifact-actions" hidden>
      <button type="button" class="save-artifact" data-save-artifact data-i18n="saveArtifact"></button>
      <a class="text-link" data-compare-current data-i18n="compareThis" href="archive.html"></a>
      <span class="model-badge" data-i18n="modelConceptual"></span>
    </div>
    <div class="scene-controls">
      <button type="button" data-scene-control="left" data-i18n-aria="rotateLeft">↶</button>
      <button type="button" data-scene-control="right" data-i18n-aria="rotateRight">↷</button>
      <button type="button" data-scene-control="out" data-i18n-aria="zoomOut">−</button>
      <button type="button" data-scene-control="in" data-i18n-aria="zoomIn">+</button>
      <button type="button" data-scene-control="reset" data-i18n="resetView"></button>
    </div>
  </section>
  <div class="page-content">
    <section class="journey" data-journey hidden aria-labelledby="journey-heading">
      <div class="journey-head">
        <div class="journey-head-copy">
          <p class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="journeyKicker"></span></p>
          <h2 id="journey-heading" data-i18n="journeyTitle"></h2>
          <p class="journey-record" data-journey-record></p>
        </div>
        <div class="journey-head-side">
          <p class="journey-progress-copy" data-journey-progress-copy></p>
          <button type="button" class="journey-toggle" data-journey-toggle aria-expanded="true" aria-controls="journey-body"></button>
        </div>
      </div>
      <div class="journey-body" id="journey-body" data-journey-body>
        <ul class="journey-intro-points">
          <li data-i18n="journeyIntro"></li>
          <li data-i18n="journeySourceNote"></li>
        </ul>
        <div class="journey-progress" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" data-journey-progress><span></span></div>
        <nav class="journey-nav" data-journey-nav></nav>
        <div class="journey-panel" data-journey-panel>
          <div class="journey-chapter" data-journey-chapter></div>
          <div class="journey-extras" data-journey-extras></div>
        </div>
        <div class="journey-controls">
          <button type="button" class="journey-step" data-journey-prev></button>
          <button type="button" class="journey-step journey-step-next" data-journey-next></button>
          <button type="button" class="journey-dossier" data-journey-dossier></button>
        </div>
      </div>
    </section>
    <div class="dossier-layout">
      <aside class="dossier-sidebar">
        <form class="dossier-lookup" data-dossier-form>
          <h2 data-i18n="dossierLookup"></h2>
          <label><span data-i18n="dossierLookupLabel"></span><input data-dossier-input list="priority-ids" placeholder="" data-i18n-placeholder="dossierLookupPlaceholder" autocomplete="off">
            <datalist id="priority-ids">
              <option value="MOON-AP11-LMDS"></option>
              <option value="MOON-AP11-LRRR"></option>
              <option value="MOON-AP12-LMDS"></option>
              <option value="MOON-AP14-LMDS"></option>
              <option value="MOON-AP14-LRRR"></option>
              <option value="MOON-AP15-LMDS"></option>
              <option value="MOON-AP15-LRV"></option>
              <option value="MOON-AP15-LRRR"></option>
              <option value="MOON-ALSEP"></option>
              <option value="MOON-AP16-LMDS"></option>
              <option value="MOON-AP17-LMDS"></option>
              <option value="MOON-SURV1-HULL"></option>
              <option value="MOON-SURV3-HULL"></option>
              <option value="MOON-SURV3-TV-CAMERA"></option>
              <option value="MOON-SURV5-HULL"></option>
              <option value="MOON-SURV6-HULL"></option>
              <option value="MOON-SURV7-HULL"></option>
              <option value="MARS-MER-OPPORTUNITY"></option>
              <option value="MARS-MER-SPIRIT"></option>
              <option value="MARS-M20-BACKSHELL"></option>
              <option value="MARS-PATHFINDER-SOJOURNER"></option>
            </datalist>
          </label>
          <button type="submit" data-i18n="dossierOpen"></button>
          <p class="body-copy" data-i18n="dossierFieldsNote"></p>
        </form>
        <div class="dossier-side-note">
          <p class="eyebrow" data-i18n="dossierGuideLabel"></p>
          <p data-i18n="dossierGuideText"></p>
          <a class="text-link" href="archive.html" data-i18n="navArchive"></a>
        </div>
        <div class="dossier-side-note">
          <p class="eyebrow" data-i18n="storageLabel"></p>
          <p data-storage-note data-i18n="storageNote"></p>
        </div>
      </aside>
      <section class="dossier-body">
        <div class="dossier-empty" data-dossier-empty-state>
          <div class="dossier-visual"><img src="../src/assets/component-study.svg" alt="" aria-hidden="true"><span data-i18n="dossierVisualCaption"></span></div>
          <span class="record-id" data-dossier-id></span>
          <h2 data-i18n="dossierEmptyTitle"></h2>
          <p data-dossier-empty data-i18n="dossierEmpty"></p>
          <p class="dossier-empty-hint" data-i18n="artifactModelNote"></p>
        </div>
        <article class="dossier-record" data-dossier-content hidden>
          <header class="dossier-record-head">
            <div>
              <span class="record-tag" data-i18n="dossierRecordLabel"></span>
              <span class="record-id" data-dossier-id></span>
              <h2 data-dossier-name></h2>
              <p class="dossier-record-meta" data-dossier-meta></p>
            </div>
            <div class="dossier-status-block">
              <span class="dossier-status-label" data-i18n="dossierStatus"></span>
              <strong data-dossier-status></strong>
              <span data-dossier-status-detail></span>
            </div>
          </header>
          <div class="dossier-story">
            <p class="eyebrow" data-i18n="dossierStoryLabel"></p>
            <p data-dossier-story></p>
          </div>
          <dl class="dossier-field-grid" data-dossier-fields></dl>
          <section class="dossier-section">
            <div class="dossier-section-heading"><span class="section-marker"><span>01</span><span class="marker-line"></span></span><h3 data-i18n="lifecycleTitle"></h3></div>
            <div class="lifecycle" data-artifact-lifecycle></div>
          </section>
          <section class="dossier-section dossier-two-column">
            <div>
              <div class="dossier-section-heading"><span class="section-marker"><span>02</span><span class="marker-line"></span></span><h3 data-i18n="dossierSignificanceTitle"></h3></div>
              <p data-dossier-significance></p>
            </div>
            <div>
              <div class="dossier-section-heading"><span class="section-marker"><span>03</span><span class="marker-line"></span></span><h3 data-i18n="dossierEvidenceTitle"></h3></div>
              <p data-dossier-evidence></p>
            </div>
          </section>
          <section class="dossier-section">
            <div class="dossier-section-heading"><span class="section-marker"><span>04</span><span class="marker-line"></span></span><h3 data-i18n="dossierComponentsTitle"></h3></div>
            <div data-dossier-components></div>
          </section>
          <section class="dossier-section">
            <div class="dossier-section-heading"><span class="section-marker"><span>05</span><span class="marker-line"></span></span><h3 data-i18n="dossierEventsTitle"></h3></div>
            <div data-dossier-events></div>
          </section>
          <section class="dossier-section dossier-two-column">
            <div>
              <div class="dossier-section-heading"><span class="section-marker"><span>06</span><span class="marker-line"></span></span><h3 data-i18n="dossierRelatedTitle"></h3></div>
              <div data-dossier-related></div>
            </div>
            <div>
              <div class="dossier-section-heading"><span class="section-marker"><span>07</span><span class="marker-line"></span></span><h3 data-i18n="dossierFamilyTitle"></h3></div>
              <div data-dossier-family></div>
            </div>
          </section>
          <section class="dossier-section">
            <div class="dossier-section-heading"><span class="section-marker"><span>08</span><span class="marker-line"></span></span><h3 data-i18n="dossierModelTitle"></h3></div>
            <p data-dossier-model-note></p>
          </section>
          <details class="source-drawer" data-source-drawer>
            <summary data-i18n="sourceDrawer"></summary>
            <ul data-source-list></ul>
          </details>
          <div class="dossier-record-actions">
            <button type="button" class="save-artifact" data-save-artifact data-i18n="saveArtifact"></button>
            <a class="button button-primary" data-compare-current data-i18n="compareThis" href="archive.html"></a>
          </div>
        </article>
      </section>
    </div>
  </div>
</main>
