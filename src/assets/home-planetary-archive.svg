<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Abstract planetary archive illustration</title>
  <desc id="desc">An original vector rendering of a shadowed cratered world, orbital traces and distant stars. It is an illustration, not a mission photograph.</desc>
  <defs>
    <radialGradient id="space" cx="72%" cy="43%" r="78%"><stop stop-color="#1d303a"/><stop offset=".43" stop-color="#0d1a25"/><stop offset="1" stop-color="#060d15"/></radialGradient>
    <radialGradient id="world" cx="31%" cy="24%" r="78%"><stop stop-color="#d0cec1"/><stop offset=".22" stop-color="#9ea5a1"/><stop offset=".58" stop-color="#59676c"/><stop offset=".84" stop-color="#273640"/><stop offset="1" stop-color="#111b23"/></radialGradient>
    <radialGradient id="glow" cx="0" cy=".5" r="1"><stop stop-color="#b9d3d2" stop-opacity=".24"/><stop offset="1" stop-color="#9bc5ca" stop-opacity="0"/></radialGradient>
    <linearGradient id="limb" x1=".15" y1="0" x2=".8" y2="1"><stop stop-color="#e3e4d7" stop-opacity=".55"/><stop offset=".5" stop-color="#9cb4b4" stop-opacity=".08"/><stop offset="1" stop-color="#0b1218" stop-opacity="0"/></linearGradient>
    <pattern id="stars" width="187" height="163" patternUnits="userSpaceOnUse"><circle cx="17" cy="23" r="1.5" fill="#e1ebdf" opacity=".7"/><circle cx="102" cy="70" r="1" fill="#a5c0c9" opacity=".8"/><circle cx="153" cy="134" r="1.2" fill="#d9d5c5" opacity=".55"/><circle cx="63" cy="151" r=".8" fill="#fff" opacity=".7"/></pattern>
    <pattern id="terrain" width="190" height="150" patternUnits="userSpaceOnUse"><path d="M22 71c8-22 34-28 52-18 14 8 16 23 5 33-10 9-33 12-49 5-10-4-13-12-8-20Zm104 48c5-14 22-20 36-14 12 5 16 15 8 23-8 8-25 9-36 5-8-3-11-8-8-14ZM125 19c4-9 15-13 25-9 8 3 10 10 4 15-6 5-17 6-24 3-5-2-7-5-5-9Z" fill="#19262e" opacity=".28"/><path d="M25 69c11-16 39-20 53-8M128 116c7-10 22-13 34-7" fill="none" stroke="#d0d1c4" stroke-opacity=".14" stroke-width="2"/></pattern>
    <clipPath id="planetClip"><circle cx="1055" cy="685" r="470"/></clipPath>
  </defs>
  <path fill="url(#space)" d="M0 0h1600v1100H0z"/>
  <path fill="url(#stars)" opacity=".8" d="M0 0h1600v1100H0z"/>
  <ellipse cx="1030" cy="766" rx="710" ry="320" fill="url(#glow)"/>
  <g fill="none" stroke="#9cc2c7" stroke-opacity=".19">
    <ellipse cx="1055" cy="685" rx="660" ry="230" transform="rotate(-18 1055 685)" stroke-width="2"/>
    <ellipse cx="1055" cy="685" rx="770" ry="365" transform="rotate(31 1055 685)" stroke-opacity=".1"/>
    <path d="M108 815c246-199 442-253 707-177 208 60 340 127 562 57" stroke="#d0a36c" stroke-opacity=".45" stroke-dasharray="4 12"/>
  </g>
  <circle cx="1055" cy="685" r="485" fill="none" stroke="#b6d4d0" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="1055" cy="685" r="470" fill="url(#world)"/>
  <g clip-path="url(#planetClip)">
    <circle cx="1055" cy="685" r="470" fill="url(#terrain)" opacity=".88"/>
    <ellipse cx="898" cy="460" rx="72" ry="34" fill="#334047" opacity=".45"/><ellipse cx="898" cy="454" rx="54" ry="23" fill="none" stroke="#d7d7c8" stroke-opacity=".19" stroke-width="5"/>
    <ellipse cx="1164" cy="675" rx="93" ry="43" fill="#27343b" opacity=".49"/><ellipse cx="1164" cy="665" rx="70" ry="28" fill="none" stroke="#d7d7c8" stroke-opacity=".17" stroke-width="6"/>
    <ellipse cx="950" cy="866" rx="42" ry="20" fill="#29363c" opacity=".47"/><ellipse cx="950" cy="860" rx="29" ry="11" fill="none" stroke="#d7d7c8" stroke-opacity=".13" stroke-width="4"/>
    <path d="M570 560c163-162 312-219 467-202 141 16 283 101 448 79" fill="none" stroke="url(#limb)" stroke-width="85" opacity=".54"/>
    <path d="M650 960c172-83 282-90 400-54 110 34 202 23 325-42" fill="none" stroke="#e0d6bd" stroke-opacity=".08" stroke-width="22"/>
  </g>
  <g fill="#d0a36c"><circle cx="345" cy="461" r="5"/><circle cx="388" cy="430" r="2"/><circle cx="1346" cy="272" r="3"/></g>
  <g fill="none" stroke="#bacdca" stroke-opacity=".45" stroke-width="1"><path d="M174 270h42m-21-21v42"/><path d="M1422 857h34m-17-17v34"/></g>
</svg>
